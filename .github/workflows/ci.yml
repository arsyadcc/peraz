name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  deny:
    name: dependencies (licenses, advisories, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  integration:
    name: integration (ubuntu, system FFmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo -E apt-get update -q && sudo -E apt-get install -y -q --no-install-recommends ffmpeg zip
      - run: ffmpeg -version | head -1
      - run: ./scripts/make-fixtures.sh
      - run: cargo test --workspace --locked -- --nocapture
      - run: cargo run --locked -- doctor
      - run: cargo run --locked -- probe fixtures/*.mp4 fixtures/*.png
      - run: cargo run --locked -- compress --out-dir "$RUNNER_TEMP" fixtures/*.mp4
