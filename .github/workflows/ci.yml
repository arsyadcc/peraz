name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch or pull request cancels the older run, so runs do not queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  deny:
    name: dependencies (licenses, advisories, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in its own job below, which also builds the samples: one macOS runner per run.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  integration:
    name: integration (ubuntu, system FFmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo -E apt-get update -q && sudo -E apt-get install -y -q --no-install-recommends ffmpeg zip
      - run: ffmpeg -version | head -1
      - run: ./scripts/make-fixtures.sh
      - run: cargo test --workspace --locked -- --nocapture
      - run: cargo run --locked -- doctor
      - run: cargo run --locked -- probe fixtures/*.mp4 fixtures/*.png
      - run: cargo run --locked -- compress --out-dir "$RUNNER_TEMP" fixtures/*.mp4

  macos:
    name: test and integration (macos, Homebrew FFmpeg)
    # Pinned: the newest image has the least capacity, and changes without notice.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: brew install ffmpeg
      - run: ffmpeg -version | head -1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # sips makes the HEIC samples, so only this job tests HEIC end to end.
      - run: ./scripts/make-fixtures.sh
      - run: cargo test --workspace --locked -- --nocapture 2>&1 | tee test.log
        shell: bash # -o pipefail, so a failing test fails the step despite tee
      - name: no test skipped for a missing sample
        run: "! grep -F 'skipped: ' test.log"
