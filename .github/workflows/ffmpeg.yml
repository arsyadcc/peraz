# Builds the FFmpeg that Peraz bundles (scripts/build-ffmpeg.sh) for every release target, checks
# it with scripts/test-ffmpeg-build.sh, and keeps the binaries, licenses, and sources as workflow
# artifacts. Building takes a while and macOS runners are scarce, so this runs only when the
# scripts or this workflow change, and by hand.
#
# A tag `ffmpeg-<version>-<build>` (for example ffmpeg-9.0.2-1) publishes the builds as a GitHub
# release of their own, with the complete sources and checksums. `peraz ffmpeg install` and the
# peraz-full archives download them from there.
name: FFmpeg

on:
  pull_request:
    paths:
      - scripts/build-ffmpeg.sh
      - scripts/test-ffmpeg-build.sh
      - .github/workflows/ffmpeg.yml
  push:
    branches: [main]
    # Path filters do not apply to tags.
    tags: ['ffmpeg-*']
    paths:
      - scripts/build-ffmpeg.sh
      - scripts/test-ffmpeg-build.sh
      - .github/workflows/ffmpeg.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # The oldest supported Ubuntu, so the binaries run on older glibc versions too.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Cross-built with MinGW-w64, then tested on Windows below.
          - target: x86_64-pc-windows-msvc
            os: ubuntu-24.04
            cross: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PERAZ_FFMPEG_TARGET: ${{ matrix.cross }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkg-config xxd \
            ${{ matrix.cross && 'mingw-w64' || '' }}
          pipx install meson
          pipx install ninja
          pipx install cmake
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm pkgconf
          pipx install meson
          pipx install ninja
          pipx install cmake
      - name: Cache source archives
        uses: actions/cache@v4
        with:
          path: target/ffmpeg-work/sources
          key: ffmpeg-sources-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          restore-keys: ffmpeg-sources-
      - name: Build
        run: scripts/build-ffmpeg.sh target/ffmpeg
      - name: Test
        run: scripts/test-ffmpeg-build.sh ${{ matrix.cross && '--libraries-only' || '' }} target/ffmpeg
      - name: Package
        run: |
          mkdir -p dist/peraz-ffmpeg
          cp target/ffmpeg/ffmpeg* target/ffmpeg/ffprobe* target/ffmpeg/cjxl* target/ffmpeg/djxl* dist/peraz-ffmpeg/
          cp -R target/ffmpeg/licenses dist/peraz-ffmpeg/
          version=$(sed -n 's/^  "ffmpeg|\([^|]*\)|.*/\1/p' scripts/build-ffmpeg.sh)
          libjxl=$(sed -n 's/^  "libjxl|\([^|]*\)|.*/\1/p' scripts/build-ffmpeg.sh)
          if [[ $GITHUB_REF == refs/tags/ffmpeg-* ]]; then
            where="peraz-ffmpeg-sources.tar from https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          else
            where="the sources archive published next to this one"
          fi
          cat > dist/peraz-ffmpeg/README.txt <<EOF
          FFmpeg $version for Peraz (https://github.com/$GITHUB_REPOSITORY), built for
          ${{ matrix.target }} by scripts/build-ffmpeg.sh at commit $GITHUB_SHA.

          Peraz uses these programs when this folder, peraz-ffmpeg, is next to the peraz
          executable. \`peraz doctor\` shows which FFmpeg Peraz uses. cjxl and djxl, from
          libjxl $libjxl, make and read JPEG XL.

          This build of FFmpeg is licensed under the GNU General Public License, version 3 or
          later, because it includes x264 and x265. It also includes SVT-AV1, dav1d, libvmaf, and
          libwebp. cjxl and djxl are under libjxl's BSD license. The license texts are in the
          licenses folder. The complete corresponding source code, with the script that builds
          it, is in $where.
          EOF
          tar -C dist -cJf "peraz-ffmpeg-${{ matrix.target }}.tar.xz" peraz-ffmpeg
          tar -C target/ffmpeg -cf "peraz-ffmpeg-sources-${{ matrix.target }}.tar" sources
          ls -l peraz-ffmpeg-*
      - uses: actions/upload-artifact@v4
        with:
          name: peraz-ffmpeg-${{ matrix.target }}
          path: |
            peraz-ffmpeg-${{ matrix.target }}.tar.xz
            peraz-ffmpeg-sources-${{ matrix.target }}.tar

  test-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: peraz-ffmpeg-x86_64-pc-windows-msvc
      - name: Test
        run: |
          tar -xJf peraz-ffmpeg-x86_64-pc-windows-msvc.tar.xz
          scripts/test-ffmpeg-build.sh peraz-ffmpeg

  # On an ffmpeg-* tag: one release with every build, the sources, and checksums. It is never
  # marked latest, so the latest release stays the newest Peraz.
  publish:
    if: startsWith(github.ref, 'refs/tags/ffmpeg-')
    needs: [build, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: peraz-ffmpeg-*
          path: artifacts
          merge-multiple: true
      - name: Assemble
        run: |
          version=$(sed -n 's/^  "ffmpeg|\([^|]*\)|.*/\1/p' scripts/build-ffmpeg.sh)
          [[ $TAG =~ ^ffmpeg-${version//./\\.}-[0-9]+$ ]] || {
            echo "Tag $TAG does not match FFmpeg $version in scripts/build-ffmpeg.sh" >&2
            exit 1
          }
          mkdir -p release sources
          mv artifacts/peraz-ffmpeg-*.tar.xz release/
          # Linux builds use every source (macOS uses its own zlib and no GPU headers), so its
          # sources cover every build: check that, then publish one archive.
          tar -C sources -xf artifacts/peraz-ffmpeg-sources-x86_64-unknown-linux-gnu.tar
          for archive in artifacts/peraz-ffmpeg-sources-*.tar; do
            tar -xOf "$archive" sources/SOURCES.txt | while read -r line; do
              grep -qxF "$line" sources/sources/SOURCES.txt || {
                echo "$archive uses a source the Linux build does not: $line" >&2
                exit 1
              }
            done
          done
          cp scripts/build-ffmpeg.sh scripts/test-ffmpeg-build.sh sources/sources/
          tar -C sources -cf release/peraz-ffmpeg-sources.tar sources
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
          cat > notes.md <<EOF
          FFmpeg $version built for Peraz by \`scripts/build-ffmpeg.sh\` at $GITHUB_SHA, for every
          platform Peraz is released for. Peraz uses it when the \`peraz-ffmpeg\` folder is next to
          the \`peraz\` executable: \`peraz ffmpeg install\` downloads it there, and the
          \`peraz-full\` archives of each Peraz release include it.

          These are GPL builds (version 3 or later) with x264, x265, SVT-AV1, dav1d, and libwebp.
          \`peraz-ffmpeg-sources.tar\` holds the exact source archives and the build script.
          EOF
      - name: Publish
        run: |
          gh release create "$TAG" release/* --verify-tag --latest=false \
            --title "FFmpeg for Peraz ($TAG)" --notes-file notes.md
