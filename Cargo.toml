[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
authors = ["Arsyad"]
repository = "https://github.com/arsyadcc/peraz"
homepage = "https://github.com/arsyadcc/peraz"
license = "GPL-3.0-or-later"

[workspace.dependencies]
peraz-core = { path = "crates/peraz-core", version = "=0.3.0" }
peraz-engine = { path = "crates/peraz-engine", version = "=0.3.0" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ctrlc = { version = "3", features = ["termination"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
imagequant = { version = "4", default-features = false, features = ["threads"] }
mozjpeg = { version = "0.10", default-features = false, features = ["parallel"] }
# Error unwinding for mozjpeg (instead of aborting); declared directly because mozjpeg only
# enables it through its default features, which also require nasm.
mozjpeg-sys = { version = "2", default-features = false, features = ["parallel", "unwinding"] }
oxipng = { version = "10", default-features = false, features = ["parallel"] }
# Only named to turn on its `dynamic` feature for `system-libs`; oxipng uses it for zlib output.
libdeflater = { version = "1", default-features = false }
png = "0.18"
webp = { version = "0.3", default-features = false }
moxcms = "0.8"
gif = "0.14"
lopdf = { version = "0.47", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "1"
quick-xml = "0.42"
toml = "1"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
# `--target-ssimulacra2`: scores a still image against its source.
ssimulacra2 = { version = "0.5", default-features = false, features = ["rayon"] }
# `peraz ffmpeg install`: HTTPS with the system's certificates, and the build's .tar.xz archive.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
lzma-rs = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Optimize dependencies (encoders) even in debug builds: tests encode real images and video.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
