[package]
name = "peraz"
description = "Compress video, images, GIFs, PDFs, and e-books from the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["compression", "video", "image", "ffmpeg", "cli"]
categories = ["command-line-utilities", "multimedia::video", "multimedia::images", "compression"]

[[bin]]
name = "peraz"
path = "src/main.rs"

[dependencies]
peraz-core.workspace = true
peraz-engine.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# SIMD JPEG and AVIF encoding for release builds (needs `nasm` on x86/x86_64 build machines).
simd = ["peraz-engine/simd-jpeg", "peraz-engine/simd-avif"]

[package.metadata.dist]
# The workspace is not published to crates.io yet, but the CLI is released with dist.
dist = true

[lints]
workspace = true
