# cargo-deny: every dependency must be compatible with Peraz's license, GPL-3.0-or-later.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
# Permissive licenses, weak copyleft, and GPL-3.0-or-later itself. Deliberately absent:
# GPL-2.0-only (incompatible with GPL-3.0) and AGPL (adds network-use terms to the binary).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "IJG",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace crates depend on each other by path.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
    # `paste` (compile-time macros, used by rav1e for AVIF) is archived, with no fixed release;
    # it is not a vulnerability. Revisit when rav1e moves off it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro crate pulled in by rav1e" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
