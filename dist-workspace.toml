[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Publish the Homebrew formula to the tap on release
tap = "arsyadcc/homebrew-tap"
# `brew install arsyadcc/tap/peraz`
formula = "peraz"
publish-jobs = ["homebrew"]
# Alpha and beta versions stay off the Homebrew tap, which keeps the stable source formula
publish-prereleases = false
# Release builds use SIMD for JPEG (mozjpeg) and AVIF (rav1e); nasm is needed on x86 to build them
features = ["simd"]
# Extra build steps (puts NASM on PATH on Windows), relative to .github/workflows
github-build-setup = "../build-setup.yml"

# Peraz runs FFmpeg as a separate program: Homebrew installs it with the formula.
[dist.dependencies.homebrew]
ffmpeg = { stage = ["run"] }
nasm = { stage = ["build"] }

[dist.dependencies.apt]
nasm = "*"

[dist.dependencies.chocolatey]
nasm = "*"
